name: Production Interval Automation Engine

on:
  schedule:
    # Runs exactly every hour, on the hour
    - cron: "0 * * * *"

  workflow_dispatch: # Allows manual execution directly from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the latest codebase changes
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Grant executable privileges to the engine runner
      - name: Make Script Executable
        run: chmod +x ../commit_runner.sh

      # 3. Fire the execution sequence
      - name: Run Script Engine
        run: ../commit_runner.sh
