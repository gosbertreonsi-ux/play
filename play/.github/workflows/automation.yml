name: Production Interval Automation Engine

on:
  schedule:
    # Optimized off-peak intervals (~Tanzania Time UTC+3)
    - cron: "19 5 * * *"   # ~08:19 EAT
    - cron: "41 8 * * *"   # ~11:41 EAT
    - cron: "19 11 * * *"  # ~14:19 EAT
    - cron: "41 14 * * *"  # ~17:41 EAT
    - cron: "19 18 * * *"  # ~21:19 EAT

  workflow_dispatch: # Allows manual execution directly from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the latest codebase changes
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Grant executable privileges to the engine runner
      - name: Make Script Executable
        run: chmod +x scripts/commit_runner.sh

      # 3. Fire the execution sequence
      - name: Run Script Engine
        run: ./scripts/commit_runner.sh
